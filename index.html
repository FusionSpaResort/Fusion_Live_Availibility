<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fusion Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#1f0000;
  --wine2:#2b0808;
  --blush:#f1c2bb;
  --cream:#f7eee9;
  --taupe:#a98c83;
  --line:rgba(241,194,187,.30);
}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;background:var(--wine);color:var(--cream);font-family:Inter,Arial,sans-serif}
body{overflow:hidden}
.screen{
  width:1080px;height:1920px;min-width:1080px;min-height:1920px;
  background:
    radial-gradient(90% 55% at 50% 42%,rgba(84,12,12,.24),transparent 70%),
    var(--wine);
  position:relative;overflow:hidden;
}
.topline{
  height:42px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;letter-spacing:.06em;font-weight:600;
  color:var(--cream);text-transform:uppercase;
}
.header{
  height:145px;border-bottom:1px solid rgba(241,194,187,.18);
  position:relative;display:flex;align-items:center;justify-content:center;
}
.logo{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 3px 10px rgba(0,0,0,.2))}
.hamburger{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:34px}
.hamburger span{display:block;height:1.5px;background:var(--cream);margin:7px 0;width:23px}
.book{
  position:absolute;right:28px;top:50%;transform:translateY(-50%);
  border:0;border-radius:28px;background:var(--taupe);color:#210707;
  padding:14px 28px;font-size:13px;letter-spacing:.14em;font-weight:600;
}
.hero{
  height:600px;position:relative;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
}
.kicker{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--blush);margin-bottom:15px}
.hero h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:92px;line-height:.84;letter-spacing:-.025em;margin:0;
  color:var(--blush);text-transform:uppercase;
}
.hero p{
  margin:25px 30px 0;max-width:720px;font-size:17px;line-height:1.55;
  color:rgba(247,238,233,.82);font-weight:300;
}
.photo{
  position:absolute;left:7.5%;right:7.5%;bottom:28px;height:250px;
  background-image:
    linear-gradient(90deg,rgba(31,0,0,.42),rgba(31,0,0,.08)),
    url("https://fusionsparesort.com/images/2026/01/fusion-spa-resort-elegant-restaurant-dining-hall-chandeliers.webp");
  background-size:cover;background-position:center;
  border-top:1px solid rgba(241,194,187,.35);
}
.availability{
  position:absolute;left:7.5%;right:7.5%;bottom:42px;
  padding:26px 28px 24px;background:rgba(31,0,0,.78);
  backdrop-filter:blur(5px);border:1px solid rgba(241,194,187,.28);
}
.avail-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.avail-title{
  font-family:"Cormorant Garamond",Georgia,serif;font-size:38px;color:var(--blush);
  text-transform:uppercase;letter-spacing:.03em
}
.avail-meta{text-align:right;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(247,238,233,.65)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{
  min-height:104px;border:1px solid rgba(241,194,187,.26);
  background:rgba(255,255,255,.035);padding:17px 18px;
}
.card .tag{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--blush);margin-bottom:8px}
.card .name{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;line-height:1.0;color:var(--cream)}
.card .time{margin-top:9px;font-size:12px;color:rgba(247,238,233,.76);letter-spacing:.08em}
.card .price{float:right;color:var(--blush)}
.empty{padding:24px;text-align:center;border:1px solid rgba(241,194,187,.2);color:rgba(247,238,233,.65);font-family:"Cormorant Garamond",Georgia,serif;font-size:23px}
.clock{position:absolute;left:28px;bottom:16px;font-size:11px;letter-spacing:.13em;color:rgba(247,238,233,.55);text-transform:uppercase}
.weather{position:absolute;right:28px;bottom:16px;font-size:11px;letter-spacing:.13em;color:rgba(247,238,233,.55);text-transform:uppercase}
body{position:relative;margin:0;padding:0;width:1080px;height:1920px;overflow:hidden}.screen{position:relative;display:block;width:1080px;height:1920px;overflow:hidden}</style>
</head>
<body>
<div class="screen">
  <div class="topline">A WELL-EARNED ESCAPE. &nbsp;★&nbsp; FUSION SPA &amp; RESORT</div>

  <header class="header">
    <div class="hamburger"><span></span><span></span></div>
    <img class="logo" src="assets/fusion-logo.png" alt="Fusion Spa & Resort">
    <button class="book">BOOK NOW</button>
  </header>

  <main class="hero">
    <div class="kicker">Fusion Live</div>
    <h1>Your<br>Sanctuary</h1>
    <p>An invitation to return to yourself. Discover today's newly released spa experiences, thoughtfully reserved for you.</p>
    <div class="photo"></div>
  </main>

  <section class="availability">
    <div class="avail-head">
      <div>
        <div class="kicker" style="margin:0 0 4px">Today</div>
        <div class="avail-title">Just Released</div>
      </div>
      <div class="avail-meta">Limited availability<br>Updated live</div>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <div id="clock" class="clock"></div>
  <div id="weather" class="weather">PHILADELPHIA · WEATHER LOADING</div>
</div>

<script>
/* Replace this array later with the live Airtable feed.
   Staff will never need to edit this page. */
const availability = [
  {name:"Signature Massage", time:"4:00 PM", duration:"60 MIN", price:"$240", tag:"Massage"},
  {name:"Body Glow Scrub", time:"5:30 PM", duration:"60 MIN", price:"$230", tag:"Scrub"},
  {name:"Restorative Facial", time:"7:00 PM", duration:"60 MIN", price:"$215", tag:"Facial"}
];

function render(){
  const el=document.getElementById("cards");
  if(!availability.length){
    el.innerHTML='<div class="empty" style="grid-column:1/-1">Every treatment is currently reserved.<br><span style="font-size:17px">Please check back for a newly released appointment.</span></div>';
    return;
  }
  el.innerHTML=availability.slice(0,6).map(x=>`
    <article class="card">
      <div class="tag">${x.tag}</div>
      <div class="name">${x.name}<span class="price">${x.price}</span></div>
      <div class="time">${x.time} · ${x.duration}</div>
    </article>`).join("");
}
render();

function tick(){
 const d=new Date();
 document.getElementById("clock").textContent =
   d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})+
   " · "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
}
tick(); setInterval(tick,30000);

fetch("https://api.open-meteo.com/v1/forecast?latitude=39.9526&longitude=-75.1652&current=temperature_2m&temperature_unit=fahrenheit")
.then(r=>r.json()).then(d=>{
 document.getElementById("weather").textContent =
 "PHILADELPHIA · "+Math.round(d.current.temperature_2m)+"°F";
}).catch(()=>{document.getElementById("weather").textContent="PHILADELPHIA";});
</script>
</body>
</html>
