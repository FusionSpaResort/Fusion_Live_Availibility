<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FUSION LIVE — Spa & Resort</title>
<style>
:root{--green:#10251d;--cream:#f5ead8;--champ:#c9a58f;--rose:#d8b9aa;--line:rgba(216,185,170,.38);--white:#fbf8f2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08130f;color:var(--white);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.screen{width:100vw;height:100vh;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 100% 0%,rgba(201,165,143,.12),transparent 60%),linear-gradient(145deg,var(--green),#0b1c15 72%,#07120e)}
.texture{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(90deg,transparent 0 49%,rgba(255,255,255,.08) 50%,transparent 51%);background-size:10px 10px;pointer-events:none}
.frame{position:absolute;inset:28px;border:1px solid rgba(216,185,170,.28);pointer-events:none}
.header{height:28%;padding:58px 72px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:270px;height:270px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.22))}
.kicker{font-family:Arial,sans-serif;letter-spacing:.42em;font-size:15px;color:var(--champ);margin-top:-24px;text-transform:uppercase}
.rule{width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--champ),transparent);margin-top:23px}
.livebar{margin:18px 72px 0;height:108px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;background:rgba(244,234,216,.055)}
.livecell{height:70%;display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:1px solid var(--line)}.livecell:last-child{border:0}
.label{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--champ);margin-bottom:7px}.value{font-family:Arial,sans-serif;font-size:23px;letter-spacing:.04em}
.main{padding:40px 72px 58px;height:calc(72% - 108px);display:flex;flex-direction:column}
.eyebrow{font-family:Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:var(--champ);font-size:13px}
h1{font-size:52px;line-height:1.02;font-weight:400;margin:12px 0 8px} .sub{font-size:21px;color:#d9d0c5;line-height:1.45;max-width:800px;margin:0 0 24px}
.availability{flex:1;display:flex;flex-direction:column;gap:13px;min-height:0}
.card{display:grid;grid-template-columns:145px 1fr auto;align-items:center;gap:22px;min-height:112px;padding:18px 22px;border:1px solid var(--line);background:linear-gradient(110deg,rgba(255,255,255,.075),rgba(255,255,255,.028));position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--champ)}
.time{font-family:Arial,sans-serif;font-size:28px}.service{font-size:26px;line-height:1.1}.meta{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#cfc5bb;margin-top:7px}
.price{font-family:Arial,sans-serif;font-size:21px;white-space:nowrap;color:var(--cream)}.status{display:inline-block;font-family:Arial,sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--champ);margin-top:7px}
.footer{display:flex;justify-content:space-between;align-items:end;margin-top:23px;padding-top:16px;border-top:1px solid var(--line)}.footer .left{font-size:20px}.footer .right{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.16em;color:#c9c0b7;text-transform:uppercase}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);background:rgba(255,255,255,.03)}.empty h2{font-size:34px;font-weight:400;margin:0 0 8px}.empty p{font-family:Arial,sans-serif;color:#cfc5bb;letter-spacing:.08em}
@media(max-width:700px){.header{padding-top:28px}.logo{width:190px;height:190px}.livebar{margin-left:30px;margin-right:30px}.main{padding-left:30px;padding-right:30px}h1{font-size:40px}}
</style>
</head>
<body>
<div class="screen"><div class="texture"></div><div class="frame"></div>
<header class="header"><img class="logo" src="assets/fusion-logo.png" alt="Fusion Spa & Resort"><div class="kicker">Spa & Resort • Philadelphia</div><div class="rule"></div></header>
<section class="livebar"><div class="livecell"><div class="label">Today</div><div class="value" id="date">—</div></div><div class="livecell"><div class="label">Local Time</div><div class="value" id="time">—</div></div><div class="livecell"><div class="label">Conditions</div><div class="value" id="weather">—</div></div></section>
<main class="main"><div class="eyebrow">A Well-Earned Escape</div><h1>Last-Minute Availability</h1><p class="sub">A limited number of experiences have opened today. Our team would be delighted to welcome you.</p><div id="availability" class="availability"></div>
<footer class="footer"><div class="left">Your sanctuary. An invitation to return to yourself.</div><div class="right">Fusion Spa & Resort</div></footer></main></div>
<script>
const demo=[
 {time:"4:00 PM",service:"Signature Massage",meta:"60 MIN • WELLNESS",price:"$240"},
 {time:"5:30 PM",service:"Restorative Facial",meta:"50 MIN • FACIAL",price:"$215"},
 {time:"7:00 PM",service:"Body Glow Scrub",meta:"50 MIN • SCRUB",price:"$230"}
];
function render(items){const box=document.getElementById('availability');box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty"><div><h2>Nothing has opened yet.</h2><p>Check back soon for newly released experiences.</p></div></div>';return}items.slice(0,6).forEach(x=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div><div class="time">${x.time}</div><div class="status">Available</div></div><div><div class="service">${x.service}</div><div class="meta">${x.meta}</div></div><div class="price">${x.price}</div>`;box.appendChild(el)})}
function tick(){const d=new Date();document.getElementById('date').textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'});document.getElementById('time').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=39.9526&longitude=-75.1652&current=temperature_2m&temperature_unit=fahrenheit&timezone=America%2FNew_York');const j=await r.json();document.getElementById('weather').textContent=Math.round(j.current.temperature_2m)+'°F'}catch(e){document.getElementById('weather').textContent='Philadelphia'}}
render(demo);tick();weather();setInterval(tick,1000);setInterval(weather,900000);
</script>
</body>
</html>
